# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The game version a newly created build is assumed to target. Rules and
    # catalog data are version-bound, so this is a real setting, not a label.
    app.default_game_version: '0.5.5'

    # Catalog sources. Both are static files on GitHub: no API key, no OAuth.
    # Snapshots are fetched at runtime into an ignored directory and are never
    # committed or served on — the data belongs to Grinding Gear Games.
    app.catalog.passive_tree_url: 'https://raw.githubusercontent.com/grindinggear/poe2-skilltree-export/main/data.json'
    app.catalog.gems_url: 'https://repoe-fork.github.io/poe2/skill_gems.min.json'
    app.catalog.uniques_url: 'https://repoe-fork.github.io/poe2/uniques.min.json'
    app.catalog.base_items_url: 'https://repoe-fork.github.io/poe2/base_items.min.json'
    app.catalog.mods_url: 'https://repoe-fork.github.io/poe2/mods.min.json'
    app.catalog.snapshot_dir: '%kernel.project_dir%/var/catalog'
    app.catalog.user_agent: 'poe-build-creation-helper/0.1 (+https://github.com/moritzkiehl/poe-build-creation-helper; contact: %app.catalog.contact%)'
    app.catalog.contact: '%env(default:app.catalog.contact_default:APP_CATALOG_CONTACT)%'
    app.catalog.contact_default: 'unset@example.invalid'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # The rules engine asks for the interface; what it gets is the stored
    # catalog. Swapping in InMemoryCatalog is how rule tests avoid a database.
    App\Catalog\CatalogPort: '@App\Catalog\DoctrineCatalog'

    # Scalar arguments autowiring cannot guess. Defined after the resource
    # block above, because later definitions replace earlier ones.
    App\Catalog\SourceFetcher:
        arguments:
            $snapshotDir: '%app.catalog.snapshot_dir%'
            $userAgent: '%app.catalog.user_agent%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
